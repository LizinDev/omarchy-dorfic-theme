# dorfic override for [polkit], written by tools/shell-overrides.py.
# A section override REPLACES the whole section, so every generated key is
# restated; hex values are frozen copies of colors.toml - re-run the tool
# after any palette change.
# Polkit authentication prompt (sudo/password dialogs). scrim is the
# darkening layer behind the card; background is the card itself.
# text-error tints the lock icon, password text, and placeholder when
# authentication fails. border-alpha applies to both border and
# border-error (the two states are mutually exclusive in time).
background       = "#8f3000"
background-alpha = 0.82
text             = "#fff3e6"
text-error       = "#ffb8ae"
border           = "hyprland.active-border"
border-error     = "#ffb8ae"
border-alpha     = 1.0
scrim            = "#8f3000"
scrim-alpha      = 0.5
# accent is the lock-icon glyph color + text-selection tint.
accent           = "#ffd23f"
